<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamerHub - Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

/* Animated background particles */
.bg-animation {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -1;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
}

.particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { width: 120px; height: 120px; left: 20%; animation-delay: 2s; }
.particle:nth-child(3) { width: 60px; height: 60px; left: 70%; animation-delay: 4s; }
.particle:nth-child(4) { width: 100px; height: 100px; left: 80%; animation-delay: 1s; }
.particle:nth-child(5) { width: 40px; height: 40px; left: 50%; animation-delay: 3s; }

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
    50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
}

.login-container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 3rem 2rem;
    text-align: center;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    animation: slideUp 0.6s ease-out;
    position: relative;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 80px;
    height: 80px;
    background: linear-gradient(45deg, #6c5ce7, #a29bfe);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 2rem;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
}

.login-container h1 {
    font-size: 2.5rem;
    font-weight: 700;
    color: white;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
}

.login-container p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 1.1rem;
    font-weight: 300;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.google-btn {
    background: linear-gradient(45deg, #4285f4, #34a853);
    border: none;
    border-radius: 12px;
    padding: 1rem 2rem;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    width: 100%;
    box-shadow: 0 10px 30px rgba(66, 133, 244, 0.3);
    position: relative;
    overflow: hidden;
}

.google-btn:before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

.google-btn:hover:before {
    left: 100%;
}

.google-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(66, 133, 244, 0.4);
}

.google-btn:active {
    transform: translateY(0);
}

.google-icon {
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #4285f4;
    font-size: 14px;
}

.features {
    margin-top: 2rem;
    display: flex;
    justify-content: space-around;
    gap: 1rem;
}

.feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
}

.feature-icon {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
}

.loading {
    display: none;
    margin-top: 1rem;
}

.spinner {
    width: 30px;
    height: 30px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top: 3px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@media (max-width: 480px) {
    .login-container {
        padding: 2rem 1.5rem;
        margin: 1rem;
    }
    
    .login-container h1 {
        font-size: 2rem;
    }
    
    .features {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .feature {
        flex-direction: row;
        justify-content: center;
    }
}
</style>
</head>
<body>

<div class="bg-animation">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="login-container">
    <div class="logo">🎮</div>
    <h1>GamerHub</h1>
    <p>Rejoignez la communauté gaming ultime et connectez-vous avec des milliers de joueurs passionnés</p>
    
    <button id="google-login" class="google-btn">
        <div class="google-icon">G</div>
        <span>Connexion avec Google</span>
    </button>
    
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="color: rgba(255, 255, 255, 0.8); margin-top: 0.5rem;">Connexion en cours...</p>
    </div>
    
    <div class="features">
        <div class="feature">
            <div class="feature-icon">👥</div>
            <span>Communauté</span>
        </div>
        <div class="feature">
            <div class="feature-icon">🏆</div>
            <span>Tournois</span>
        </div>
        <div class="feature">
            <div class="feature-icon">💬</div>
            <span>Chat</span>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";

// Your web app's Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyAlNL7mff2FJ5E0ODtl-EyO3dk0wLdq5Dk",
    authDomain: "gamer-hub-bd62e.firebaseapp.com",
    databaseURL: "https://gamer-hub-bd62e-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gamer-hub-bd62e",
    storageBucket: "gamer-hub-bd62e.firebasestorage.app",
    messagingSenderId: "892321587019",
    appId: "1:892321587019:web:26373171797453498ed2ce",
    measurementId: "G-7D1TBYHJKL"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);
const analytics = getAnalytics(app);

const googleLoginBtn = document.getElementById("google-login");
const loadingDiv = document.getElementById("loading");

googleLoginBtn.addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    
    // Show loading
    googleLoginBtn.style.display = "none";
    loadingDiv.style.display = "block";
    
    try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        
        // Save user data to database
        await saveUserData(user);
        
        console.log("Connexion réussie:", user);
        
    } catch (error) {
        console.error("Erreur de connexion:", error);
        
        // Hide loading and show button again
        loadingDiv.style.display = "none";
        googleLoginBtn.style.display = "flex";
        
        alert("Erreur de connexion. Veuillez réessayer.");
    }
});

async function saveUserData(user) {
    try {
        const userRef = ref(database, 'users/' + user.uid);
        
        // Check if user already exists
        const snapshot = await get(userRef);
        
        const userData = {
            uid: user.uid,
            displayName: user.displayName,
            email: user.email,
            photoURL: user.photoURL,
            lastLogin: new Date().toISOString()
        };
        
        // If user doesn't exist, add creation date and default values
        if (!snapshot.exists()) {
            userData.createdAt = new Date().toISOString();
            userData.gamesPlayed = [];
            userData.friends = {};
            userData.achievements = {};
            userData.level = 1;
            userData.experience = 0;
            userData.status = "online";
        }
        
        await set(userRef, userData);
        console.log("Données utilisateur sauvegardées");
        
    } catch (error) {
        console.error("Erreur lors de la sauvegarde:", error);
    }
}

onAuthStateChanged(auth, (user) => {
    if (user) {
        console.log("Utilisateur connecté:", user);
        // Redirect to home page after a short delay for better UX
        setTimeout(() => {
            window.location.href = "home.html";
        }, 1000);
    }
});
</script>

</body>
</html>

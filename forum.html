<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamerHub - Forum</title>
<style>
body { margin:0; font-family:'Poppins',sans-serif; background:#1f1c2c; color:#f5f5f5; }
header { padding:1rem; font-size:1.8rem; font-weight:bold; background:#2b2a40; text-align:center; }
.container { max-width:700px; margin:1rem auto; padding:0 1rem; display:flex; flex-direction:column; gap:1rem; }
.post-form { background:#2b2a40; border-radius:15px; padding:1rem; }
.post-form textarea { width:100%; resize:none; padding:0.5rem; border-radius:10px; border:none; background:#3a384f; color:#f5f5f5; }
.post-form input[type="file"] { margin-top:0.5rem; }
button { margin-top:0.5rem; padding:0.5rem 1rem; border:none; border-radius:10px; background:#6c5ce7; color:white; cursor:pointer; }
.post { background:#2b2a40; border-radius:15px; padding:1rem; }
.post-header { display:flex; align-items:center; gap:0.8rem; margin-bottom:0.5rem; }
.post-header img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
.post-content img { max-width:100%; border-radius:10px; margin-top:0.5rem; }
.bottom-nav { position:fixed; bottom:0; left:0; width:100%; background:#2b2a40; display:flex; justify-content:space-around; padding:0.5rem 0; border-top:1px solid #444; }
.bottom-nav a { flex:1; text-align:center; color:#f5f5f5; font-weight:bold; text-decoration:none; }
.bottom-nav a:hover { color:#6c5ce7; }
</style>
</head>
<body>

<header>GamerHub - Forum</header>

<div class="container">
    <div class="post-form">
        <textarea id="post-text" rows="2" placeholder="Partager un post"></textarea>
        <input type="file" id="post-file" accept="image/*">
        <button onclick="sendPost()">Publier</button>
    </div>
    <div id="post-box"></div>
</div>

<nav class="bottom-nav">
    <a href="home.html">ACCUEIL</a>
    <a href="forum.html">FORUM</a>
    <a href="chat.html">CHAT</a>
    <a href="profil.html">PROFIL</a>
</nav>

<script type="module" src="forum.js"></script>
</body>
</html>

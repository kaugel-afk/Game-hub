<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamerHub - Chat</title>
<style>
body { margin:0; font-family:'Poppins',sans-serif; background:#1f1c2c; color:#f5f5f5; }
header { padding:1rem; font-size:1.8rem; font-weight:bold; background:#2b2a40; text-align:center; }
.container { max-width:700px; margin:1rem auto; padding:0 1rem; display:flex; flex-direction:column; gap:1rem; }
.chat-form { background:#2b2a40; border-radius:15px; padding:1rem; display:flex; gap:0.5rem; }
.chat-form input[type="text"] { flex:1; padding:0.5rem; border-radius:10px; border:none; background:#3a384f; color:#f5f5f5; }
.chat-form input[type="file"] {}
button { padding:0.5rem 1rem; border:none; border-radius:10px; background:#6c5ce7; color:white; cursor:pointer; }
.message { background:#2b2a40; border-radius:15px; padding:0.5rem 1rem; display:flex; gap:0.5rem; align-items:center; }
.message img { width:35px; height:35px; border-radius:50%; object-fit:cover; }
.bottom-nav { position:fixed; bottom:0; left:0; width:100%; background:#2b2a40; display:flex; justify-content:space-around; padding:0.5rem 0; border-top:1px solid #444; }
.bottom-nav a { flex:1; text-align:center; color:#f5f5f5; font-weight:bold; text-decoration:none; }
.bottom-nav a:hover { color:#6c5ce7; }
</style>
</head>
<body>

<header>GamerHub - Chat Global</header>

<div class="container">
    <div class="chat-form">
        <input type="text" id="chat-text" placeholder="Écrire un message...">
        <input type="file" id="chat-file" accept="image/*">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
    <div id="chat-box"></div>
</div>

<nav class="bottom-nav">
    <a href="home.html">ACCUEIL</a>
    <a href="forum.html">FORUM</a>
    <a href="chat.html">CHAT</a>
    <a href="profil.html">PROFIL</a>
</nav>

<script type="module" src="chat.js"></script>
</body>
</html>
